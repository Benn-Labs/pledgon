# Maps the secret ID a workflow requests with runtime.GetSecret(&cre.SecretRequest{Id: ...})
# to the environment variable holding its value. In a Confidential Workflow these
# are released by the Vault DON directly into the attested enclave.
secretsNames:
    VERIFICATION_API_TOKEN:
        - SECRET_VERIFICATION_API_TOKEN
    COMPLIANCE_API_TOKEN:
        - SECRET_COMPLIANCE_API_TOKEN
    LENDING_PRICE_API_TOKEN:
        - SECRET_LENDING_PRICE_API_TOKEN
